# The deterministic half: plain CronJobs, no model. Each run clones the repo and runs
# one script from tools/goals/, so the code that decides is reviewed like any other code.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: goal-scoreboard
spec:
  schedule: "0 9 * * 1-5"  # weekdays, 09:00 UTC
  timeZone: UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: src
              emptyDir: {}
          initContainers:
            - name: clone
              image: alpine/git:2.45.2
              command: ["sh", "-c"]
              args:
                - git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/your-org/your-repo.git" /src
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef: {name: goal-agents, key: GITHUB_TOKEN}
              volumeMounts:
                - {name: src, mountPath: /src}
          containers:
            - name: scoreboard
              image: python:3.12-slim
              workingDir: /src
              command: ["python3", "tools/goals/scoreboard.py"]
              envFrom:
                - secretRef: {name: goal-agents}
              env:
                - name: PROMETHEUS_URL
                  value: http://prometheus.monitoring.svc:9090
              volumeMounts:
                - {name: src, mountPath: /src}
---
